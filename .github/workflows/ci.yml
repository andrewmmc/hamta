name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install test tools
        run: |
          sudo apt-get update
          sudo apt-get install -y bats shellcheck

      - name: Syntax check
        run: bash -n bin/hamta

      - name: ShellCheck
        run: shellcheck bin/hamta scripts/bump-version.sh

      - name: Run tests
        run: bats test/hamta.bats
